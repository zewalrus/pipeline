<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theme Page Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="firebase-config.js"></script>
<meta name="theme-color" content="#F6F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15121B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Studio">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F2EC; --card:#FFFDF9; --sunk:#EFE9E0; --line:#E2D9CC; --ink:#221B2E; --muted:#776E80;
  --accent:#6E4FB0; --accent-soft:#ECE5F7;
  --reel:#6E4FB0; --carousel:#B07A22; --image:#2A8279;
  --ig:#C7386F; --fb:#2F64CF; --good:#3B8456; --bad:#BC4134;
  --r:12px; --nav:64px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15121B; --card:#1F1A27; --sunk:#191520; --line:#332C3E; --ink:#F1ECF6; --muted:#A69EB1;
    --accent:#A88BE6; --accent-soft:#2C2440;
    --reel:#A88BE6; --carousel:#E2AE55; --image:#4DB6AA;
    --ig:#EE6C9C; --fb:#6E98F0; --good:#62B47F; --bad:#E77266;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Manrope",system-ui,sans-serif;
  padding-bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
h1,h2{font-family:"Fraunces",Georgia,serif;font-weight:700;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.1}
h2{font-size:22px;margin:4px 0 2px}
h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.small{font-size:13px;color:var(--muted)}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}

header.top{padding:calc(18px + env(safe-area-inset-top)) 16px 12px}
header.top .eyebrow{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex}
nav.tabs button{flex:1;height:var(--nav);background:none;border:0;color:var(--muted);font:600 11px/1.1 "Manrope",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

section.view{display:none}
section.view.on{display:block}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px}
label.f:first-child{margin-top:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],input[type=url],textarea,select{
  width:100%;font:15px "Manrope",sans-serif;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:42px}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > div > label.f{margin-top:12px}

button{font:600 14px "Manrope",sans-serif;cursor:pointer;border:1px solid var(--accent);background:var(--accent);
  color:#fff;border-radius:10px;padding:10px 14px;min-height:40px}
@media (prefers-color-scheme: dark){ button{color:#15121B} }
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.tiny{font-size:13px;padding:6px 10px;min-height:32px;font-weight:600}
button.danger{color:var(--bad)}
button.done{background:var(--good);border-color:var(--good)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.grow{flex:1}

/* segmented control */
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;border:0;color:var(--muted);min-height:34px;padding:6px 8px;font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 13px "Manrope",sans-serif;border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:6px 12px;min-height:32px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pick button{background:var(--sunk);border:1px dashed var(--line);color:var(--ink);font-weight:500;font-size:13px;
  text-align:left;border-radius:8px;padding:6px 9px;min-height:30px}

/* format tags + platform badges */
.ft{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 7px;border-radius:6px;color:#fff;background:var(--reel);vertical-align:1px}
@media (prefers-color-scheme: dark){ .ft{color:#15121B} }
.ft.carousel{background:var(--carousel)} .ft.image{background:var(--image)}
.pb{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;
  border:1px solid currentColor;opacity:.75}
.pb.ig{color:var(--ig)} .pb.fb{color:var(--fb)}
.pb.posted{opacity:1;background:currentColor}
.pb.posted span{color:var(--card)}

/* post cards */
.list{display:grid;gap:8px}
.pc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--reel);
  border-radius:var(--r);padding:11px 12px;color:var(--ink);font-weight:400;min-height:0}
.pc[data-fmt=carousel]{border-left-color:var(--carousel)} .pc[data-fmt=image]{border-left-color:var(--image)}
.pc .t{font-weight:700;font-size:15px;margin:5px 0 4px;line-height:1.3;display:block}
.pc .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.stage{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.stage.ready{color:var(--good)} .stage.posted,.stage.postiz,.stage.meta{color:var(--accent)}
.rc .metabtn{margin-top:-2px;width:100%;border-top-left-radius:0;border-top-right-radius:0}
.rc .pc{border-bottom-left-radius:0;border-bottom-right-radius:0}

.qc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--reel);border-radius:var(--r);padding:11px 12px}
.qc[data-fmt=carousel]{border-left-color:var(--carousel)} .qc[data-fmt=image]{border-left-color:var(--image)}
.qc .open{background:none;border:0;color:var(--ink);padding:0;text-align:left;width:100%;font-weight:400;min-height:0}
.qc .t{font-weight:700;display:block;margin:5px 0 2px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;cursor:pointer;color:var(--ink);min-height:0;font-weight:400}
.wd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wd .d{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.wd .n{font-family:"Fraunces",serif;font-size:18px;font-weight:700;margin:1px 0 5px}
.dots{display:flex;justify-content:center;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.dot.ig.on{background:var(--ig);border-color:var(--ig)} .dot.fb.on{background:var(--fb);border-color:var(--fb)}
.legend{display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}

.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;color:var(--ink);font-weight:400;min-height:0}
.stat b{display:block;font-family:"Fraunces",serif;font-size:22px;line-height:1.1}
.stat span{font-size:11px;color:var(--muted);font-weight:600}

.bar{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.bar .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px 14px;text-align:center;color:var(--muted);font-size:14px}
.gap{display:inline-block;font-size:11px;font-weight:700;color:var(--bad);border:1px dashed var(--bad);border-radius:6px;padding:2px 6px;margin-right:4px}

/* plan */
.day{margin-bottom:14px}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dh b{font-family:"Fraunces",serif;font-size:17px}
.dh .small{flex:1}
.day.today .dh b{color:var(--accent)}

/* idea list */
.idea{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}
.idea p{font-weight:600;margin-bottom:6px}
.spark{font-family:"Fraunces",serif;font-size:19px;line-height:1.3;margin:2px 0 4px;min-height:2.6em}

/* editor sheet */
#sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:none;
  padding-bottom:calc(30px + env(safe-area-inset-bottom))}
#sheet.on{display:block}
body.locked{overflow:hidden}
.sh-top{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 0 8px}
.sh-top .in{max-width:760px;margin:0 auto;padding:0 16px;display:flex;gap:8px;align-items:center}
.sh-top .ttl{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-body{padding-top:12px}
.item{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.item-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.item-top .lbl{font-size:12px;font-weight:700;color:var(--accent);flex:1}
.item-top button{background:transparent;border:1px solid var(--line);color:var(--muted);min-height:30px;min-width:32px;padding:3px 8px;font-size:13px}
.item input{margin-bottom:6px}
.item textarea{min-height:52px}
.count{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.count.warn{color:var(--bad);font-weight:600}
.tagprev{font-size:13px;color:var(--accent);margin-top:6px;word-break:break-word}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.statgrid label.f{margin:0 0 4px}
details.more{margin-top:12px}
details.more summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent);padding:4px 0}
.plat-h{font-weight:700;margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.plat-h:first-child{margin-top:0}

.xc{display:block;background:var(--card);border:1px dashed var(--accent);border-radius:var(--r);padding:11px 12px;color:var(--ink);text-decoration:none}
.xc .t{font-weight:600;font-size:14px;margin:5px 0 4px;line-height:1.35;display:block;white-space:pre-line;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.xc .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.pzb{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
.pzbox{background:var(--accent-soft);border-radius:10px;padding:12px;margin-bottom:12px}
.pzbox .row{margin-top:8px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:10px}
.mitem{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.mitem img,.mitem video{width:100%;height:100%;object-fit:cover;display:block}
.mitem .mn{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
.mitem .mt{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:4px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.mitem .mt button{min-height:28px;min-width:28px;padding:2px 6px;font-size:13px;background:rgba(255,255,255,.9);color:#221B2E;border:0}
.filebtn{display:inline-flex;align-items:center;min-height:40px;padding:8px 14px;border-radius:10px;border:1px dashed var(--accent);
  color:var(--accent);font-weight:700;font-size:14px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;
  display:none;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.on{display:block}
.copybox{width:100%;min-height:140px;margin-top:8px;font-size:13px}
#sync-why{white-space:pre-wrap;font-size:13px;background:var(--sunk);padding:10px;border-radius:8px;margin-top:8px}
</style>
</head>
<body>

<header class="top wrap">
  <div class="eyebrow" id="hdr-date"></div>
  <h1 id="hdr-name">Theme Page Studio</h1>
</header>

<main class="wrap">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-ideas"></section>
  <section class="view" id="v-posts"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-kit">
    <div id="kit-dyn"></div>

    <!-- Static on purpose: the sync script below wires these up once. -->
    <div class="panel" id="sync-panel">
      <h3>Sync across devices</h3>
      <p class="small" id="sync-state">Checking…</p>
      <div id="sync-setup" style="display:none">
        <p class="small" style="margin-top:8px">Sync isn't set up. What's wrong:</p>
        <div id="sync-why"></div>
      </div>
      <div id="sync-signin" style="display:none">
        <label class="f">Email</label><input type="email" id="sync-email" autocomplete="username">
        <label class="f">Password</label><input type="password" id="sync-pass" autocomplete="current-password">
        <div class="row"><button id="sync-in">Sign in</button><button class="ghost" id="sync-new">Create account</button></div>
      </div>
      <div id="sync-on" style="display:none">
        <div class="row"><button class="ghost tiny" id="sync-push">Sync now</button><button class="ghost tiny" id="sync-out">Sign out</button></div>
      </div>
      <div id="sync-clash" style="display:none">
        <p class="small" id="sync-clash-txt" style="margin-top:8px"></p>
        <div class="row"><button id="clash-local">Keep this device</button><button class="ghost" id="clash-remote">Keep synced copy</button></div>
      </div>
      <p class="small" id="sync-msg" style="margin-top:6px"></p>
    </div>
  </section>
</main>

<div id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<nav class="tabs">
  <div class="in">
    <button data-a="tab" data-v="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
    <button data-a="tab" data-v="ideas"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>Ideas</button>
    <button data-a="tab" data-v="posts"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Posts</button>
    <button data-a="tab" data-v="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
    <button data-a="tab" data-v="kit"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Kit</button>
  </div>
</nav>

<script>
/* ============================================================
   DATA
   ============================================================ */
const KEY = "studio:v1";
const PLATS = [["ig","Instagram","IG"],["fb","Facebook","FB"]];
const FORMATS = [["reel","Reel"],["carousel","Carousel"],["image","Image"]];
const METRICS = [["views","Views"],["likes","Likes"],["comments","Comments"],["shares","Shares"],["saves","Saves"],["follows","Follows"]];
const IG_CAPTION_MAX = 2200, CAROUSEL_MAX = 20;

const SPARKS = [
  "5 money affirmations to repeat before bed",
  "Signs your manifestation is closer than you think",
  "The 3-6-9 method explained in 30 seconds",
  "Scripting: write your future like it already happened",
  "What to do when your manifestation isn't showing up",
  "Angel number 111: what it means when you keep seeing it",
  "A 2-minute gratitude list that shifts your energy",
  "Stop saying these 5 phrases if you want abundance",
  "Your sign to stop chasing and start attracting",
  "Self-love affirmations for when you feel stuck",
  "Limiting belief → new belief (before/after carousel)",
  "How to raise your vibration in 60 seconds",
  "'Act as if' — tiny daily examples",
  "Quote card: what you seek is seeking you",
  "The 17-second rule for focused intention",
  "Night routine for manifesting while you sleep",
  "POV: you finally stopped doubting the universe",
  "3 things to let go of to make room for what's coming",
  "Comment 'MINE' to claim this affirmation",
  "This or that: which affirmation do you need today?",
  "Gratitude prompts for the new month",
  "How to tell intuition from fear",
  "Pick a card: your message from the universe today",
  "Things that are coming to you this week (list reel)",
  "Morning affirmations over a calm sunrise clip"
];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function defaults(){
  return {
    v:1, rev:0,
    brand:{ name:"", ig:"", fb:"", perDay:1, time:"19:00", igTags:5, fbTags:3 },
    pillars:["Signs, timing & trust","Mindset & self-concept","Techniques & rituals",
             "Money & gratitude","Affirmations & energy","Self-love & relationships"],
    hooks:[
      "Stop scrolling if you're ready to manifest ___",
      "This is your sign to ___",
      "3 signs the universe is about to bless you",
      "If you're seeing this, it's not a coincidence",
      "The manifestation method nobody talks about",
      "Say this before you sleep tonight",
      "You attracted this video for a reason",
      "Your ___ is blocked because of this one belief",
      "Read this when you feel like giving up",
      "Type YES if you're claiming this"
    ],
    ctas:[
      JOURNAL_CTA,
      "Save this for when you need a reminder ✨",
      "Share this with someone who needs it today 💫",
      "Comment 'MINE' to claim it 🙏",
      "Follow for daily manifestation reminders 🌙"
    ],
    tagSets: DEFAULT_TAGSETS.map(([name,tags])=>({id:uid(), name, tags})),
    postiz:{ ig:null, fb:null, channels:[] },
    ideas:[], posts:[]
  };
}

function blankPost(format){
  return {
    id:uid(), title:"", format:format||"reel", pillar:"", stage:"draft", date:"", time:"",
    plats:{ig:true, fb:true},
    hook:"", audio:"", visual:"",
    beats:[{id:uid(),g:"Hook",t:"",d:""},{id:uid(),g:"Retain",t:"",d:""},{id:uid(),g:"Reward",t:"",d:""}],
    slides:[{id:uid(),t:"",d:""},{id:uid(),t:"",d:""}],
    caption:"", fbCaption:"", cta:"", tagSet:"", extraTags:"",
    posted:{ig:0, fb:0}, links:{ig:"", fb:""}, stats:{ig:{}, fb:{}},
    media:[], pz:null, meta:0,
    created:Date.now(), updated:Date.now()
  };
}

/* Comment-keyword CTA that triggers the ManyChat DM for the free Scripting Journal. */
const JOURNAL_CTA = "Comment JOURNAL and I'll send you my free scripting journal ✨";

/* One hashtag set per pillar, named the same, so picking a pillar picks its set. */
const DEFAULT_TAGSETS = [
  ["Signs, timing & trust",     "#lawofattraction #manifestation #divinetiming #signsfromtheuniverse #trusttheprocess"],
  ["Mindset & self-concept",    "#lawofattraction #manifestation #manifesting #selfconcept #mindsetshift"],

/* The first version's starter sets. If a save still has exactly these (never
   edited), swap in the per-pillar sets and point each post at its pillar's set. */
const OLD_TAGSETS = [
  ["Core","#lawofattraction #manifestation #affirmations #abundance #manifest"],
  ["Money","#moneymindset #abundancemindset #manifestmoney #wealthmindset #lawofattraction"],
  ["Love","#selflove #manifestlove #loveaffirmations #lawofattraction #healing"],
  ["Spiritual","#universe #synchronicity #angelnumbers #highvibes #spiritualawakening"]
];
function migrateTagSets(d){
  const sets = d.tagSets || [];
  const same = sets.length===OLD_TAGSETS.length && sets.every((t,i)=>t && t.name===OLD_TAGSETS[i][0] && t.tags===OLD_TAGSETS[i][1]);
  if(!same) return;
  const oldIds = new Set(sets.map(t=>t.id));
  d.tagSets = DEFAULT_TAGSETS.map(([name,tags])=>({id:uid(), name, tags}));
  (d.posts||[]).forEach(p=>{
    if(!p || !(p.tagSet==="" || oldIds.has(p.tagSet))) return;
    const m = d.tagSets.find(t=>t.name===p.pillar);
    p.tagSet = m ? m.id : (p.tagSet ? d.tagSets[0].id : "");
  });
}
const setForPillar = pillar => S.tagSets.find(t=>t.name===pillar);

/* The first version shipped with a different starter pillar list. If a save
   still has that exact list (never edited), switch it to the current one and
   move posts and ideas onto the closest new pillar. Edited lists are left alone. */
const OLD_PILLARS = ["Affirmations","Manifestation methods","Mindset & beliefs","Money & abundance",
  "Love & self-love","Gratitude","Signs & angel numbers","Quotes & reminders"];
const PILLAR_MAP = {
  "Affirmations":"Affirmations & energy", "Manifestation methods":"Techniques & rituals",
  "Mindset & beliefs":"Mindset & self-concept", "Money & abundance":"Money & gratitude",
  "Love & self-love":"Self-love & relationships", "Gratitude":"Money & gratitude",
  "Signs & angel numbers":"Signs, timing & trust", "Quotes & reminders":""
};
function migratePillars(d){
  if(JSON.stringify(d.pillars) !== JSON.stringify(OLD_PILLARS)) return;
  d.pillars = defaults().pillars;
  [...(d.posts||[]), ...(d.ideas||[])].forEach(x=>{
    if(x && x.pillar in PILLAR_MAP) x.pillar = PILLAR_MAP[x.pillar];
  });
}

/* Fill in anything missing so older or imported saves never crash the UI. */
function normalize(d){
  const D = defaults();
  d = (d && typeof d === "object") ? d : {};
  const out = Object.assign({}, D, d);
  out.brand = Object.assign({}, D.brand, d.brand||{});
  out.postiz = Object.assign({}, D.postiz, d.postiz||{});
  if(!Array.isArray(out.postiz.channels)) out.postiz.channels = [];
  ["pillars","hooks","ctas","tagSets","ideas","posts"].forEach(k=>{ if(!Array.isArray(out[k])) out[k] = D[k]; });
  migratePillars(out);
  migrateTagSets(out);
  /* One-time: add the free-journal call to action to existing saves. The flag
     stops it coming back if the user deletes it. */
  out.flags = Object.assign({}, d.flags);
  if(!out.flags.journalCta){
    if(!out.ctas.includes(JOURNAL_CTA)) out.ctas = [JOURNAL_CTA, ...out.ctas];
    out.flags.journalCta = true;
  }
  out.posts = out.posts.map(p=>{
    const b = blankPost(p.format);
    const q = Object.assign(b, p);
    q.plats  = Object.assign({ig:true,fb:true}, p.plats||{});
    q.posted = Object.assign({ig:0,fb:0}, p.posted||{});
    q.links  = Object.assign({ig:"",fb:""}, p.links||{});
    q.stats  = {ig:Object.assign({}, (p.stats||{}).ig), fb:Object.assign({}, (p.stats||{}).fb)};
    if(!Array.isArray(q.beats)) q.beats = b.beats;
    if(!Array.isArray(q.slides)) q.slides = b.slides;
    if(!Array.isArray(q.media)) q.media = [];
    return q;
  });
  return out;
}

/* ============================================================
   STORAGE — this device first, Firebase sync layered on top
   ============================================================ */
let S = null, MODE = "local";
function readStore(){ try{ return localStorage.getItem(KEY); }catch(e){ MODE="none"; return null; } }
function writeStore(str){ try{ localStorage.setItem(KEY,str); MODE="local"; return true; }catch(e){ MODE="none"; return false; } }
let saveTimer;
function save(){
  S.rev = (S.rev||0) + 1;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ writeStore(JSON.stringify(S)); if(BRIDGE.onLocalChange) BRIDGE.onLocalChange(); }, 250);
}
function load(){
  let raw = readStore();
  try{ S = normalize(raw ? JSON.parse(raw) : null); }catch(e){ S = normalize(null); }
  if(!S.tagSets.length) S.tagSets = defaults().tagSets;
  writeStore(JSON.stringify(S));
  render();
}

const BRIDGE = {
  onLocalChange:null,
  getState:()=>S,
  getRev:()=>S.rev||0,
  hasContent:st=>((st.posts||[]).length + (st.ideas||[]).length) > 0,
  applyRemote(d){
    const a = document.activeElement;
    if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){
      clearTimeout(BRIDGE._defer); BRIDGE._defer = setTimeout(()=>BRIDGE.applyRemote(d), 3000); return;
    }
    try{ localStorage.setItem(KEY+":before-sync", JSON.stringify(S)); }catch(e){}
    const rev = d.rev||0;
    S = normalize(d); S.rev = rev;
    writeStore(JSON.stringify(S));
    if(editing && !getPost(editing)) closeEditor();
    render(); if(editing) renderEditor();
  },
  setStatus(txt, tone){
    const e = el("sync-state"); if(!e) return;
    e.textContent = txt;
    e.style.color = tone==="bad" ? "var(--bad)" : tone==="good" ? "var(--good)" : "var(--muted)";
  }
};
window.BRIDGE = BRIDGE;

function tagsOf(p){

function textFor(p, plat){

}

/* ============================================================
   POSTIZ — the app talks to your Cloudflare relay (relay/worker.js),
   which adds the Postiz API key. Relay URL + passcode stay on this
   device only; they are never synced.
   ============================================================ */
const RKEY = "studio:relay";
function relayCfg(){ try{ return JSON.parse(localStorage.getItem(RKEY)||"{}")||{}; }catch(e){ return {}; } }
function setRelayCfg(c){ try{ localStorage.setItem(RKEY, JSON.stringify(c)); }catch(e){} }
const pzReady = () => { const c = relayCfg(); return !!(c.url && c.pass); };
const pzMapped = () => PLATS.some(([k])=>S.postiz[k]);
const platOfChannel = id => (PLATS.find(([k])=>S.postiz[k] && S.postiz[k].id===id)||[])[0];

async function pz(path, opts={}){
  const c = relayCfg();
  if(!c.url || !c.pass) throw new Error("Set up Postiz in the Kit tab first.");
  const headers = {"X-Studio-Pass": c.pass};
  if(opts.json !== undefined) headers["Content-Type"] = "application/json";
  let res;
  try{
    res = await fetch(c.url.replace(/\/+$/,"") + path, {
      method: opts.method||"GET", headers,
      body: opts.json !== undefined ? JSON.stringify(opts.json) : opts.body
    });
  }catch(e){ throw new Error("Couldn't reach the relay. Check the relay URL and your connection."); }
  const txt = await res.text(); let data; try{ data = JSON.parse(txt); }catch(e){ data = txt; }
  if(!res.ok){
    if(res.status===429) throw new Error("Postiz says too many requests. Wait a bit and try again.");
    let m = (data && typeof data==="object") ? (data.error || data.message) : data;
    if(Array.isArray(m)) m = m.join(", ");
    throw new Error(String(m || ("Error "+res.status)).slice(0,240));
  }
  return data;
}

async function pzConnect(){
  const url = el("pz-url").value.trim(), pass = el("pz-pass").value;
  if(!/^https:\/\//.test(url)) throw new Error("The relay URL should start with https://");
  if(!pass) throw new Error("Enter the passcode you saved in Cloudflare.");
  setRelayCfg({url, pass});
  const list = await pz("/public/v1/integrations");
  const chans = (Array.isArray(list) ? list : (list.integrations||[])).map(c=>({
    id:c.id, name:c.name||c.display||c.identifier, identifier:c.identifier||c.providerIdentifier||"", disabled:!!c.disabled
  }));
  S.postiz.channels = chans;
  const pick = (k, test) => {
    const keep = S.postiz[k] && chans.find(c=>c.id===S.postiz[k].id);
    S.postiz[k] = keep || chans.find(c=>test(c.identifier) && !c.disabled) || null;
  };
  pick("ig", i=>i.startsWith("instagram"));
  pick("fb", i=>i==="facebook");
  save();
  return chans.length;
}

function mediaProblem(p){
  const m = p.media, vids = m.filter(x=>/^video/.test(x.type||"") || /\.(mp4|mov|m4v|webm)$/i.test(x.path)).length;
  if(p.format==="reel"){ if(m.length!==1 || vids!==1) return "A reel needs exactly one video."; }
  else if(p.format==="carousel"){ if(m.length<2) return "A carousel needs at least 2 photos or videos."; if(m.length>CAROUSEL_MAX) return "A carousel can have at most "+CAROUSEL_MAX+" items."; }
  else if(m.length!==1) return "An image post needs exactly one image.";
  return "";
}

async function pzSchedule(p){
  if(!pzMapped()) throw new Error("Pick your Instagram and Facebook accounts in Kit → Postiz scheduling.");
  if(!p.date || !p.time) throw new Error("Set a post date and time first.");
  const when = new Date(p.date+"T"+p.time);
  if(when.getTime() < Date.now()+60e3) throw new Error("Pick a time in the future.");
  const mp = mediaProblem(p); if(mp) throw new Error(mp);
  const targets = activePlats(p).filter(([k])=>S.postiz[k]);
  if(!targets.length) throw new Error("This post isn't set to go to any connected account.");
  const posts = targets.map(([k])=>{
    const ch = S.postiz[k];
    const settings = ch.identifier.startsWith("instagram")
      ? {__type:ch.identifier, post_type:"post", collaborators:[]}
      : {__type:ch.identifier};
    return { integration:{id:ch.id}, settings,
      value:[{ content:textFor(p,k), image:p.media.map(m=>({id:m.id, path:m.path})) }] };
  });
  const res = await pz("/public/v1/posts", {method:"POST", json:{
    type:"schedule", date:when.toISOString(), shortLink:false, tags:[], posts
  }});
  const arr = Array.isArray(res) ? res : (res && (res.posts||res.data)) || [];
  const ids = arr.map(r=>{
    const integ = typeof r.integration==="object" ? (r.integration||{}).id : r.integration;
    return {id:r.postId||r.id, plat:platOfChannel(integ)||""};
  }).filter(r=>r.id);
  p.pz = {at:Date.now(), date:when.toISOString(), ids, state:{}, err:""};
  p.stage = "ready";
  touch(p);
}

async function pzCancel(p){
  let ok = false, last = null;
  for(const r of ((p.pz && p.pz.ids) || []).filter(r=>p.pz.state[r.plat]!=="PUBLISHED")){
    try{ await pz("/public/v1/posts/"+encodeURIComponent(r.id), {method:"DELETE"}); ok = true; }catch(e){ last = e; }
  }
  if(!ok && last) throw last;
  p.pz = null; touch(p);
}

const PZ_LAST = "studio:pz-last", PZ_CACHE = "studio:pz-cache";
/* Posts made on the Postiz site (not from this app). Kept on this device only. */
let pzExt = (()=>{ try{ return JSON.parse(localStorage.getItem(PZ_CACHE)||"null"); }catch(e){ return null; } })();
const extItems = () => (pzExt && pzExt.items) || [];
const stripHtml = h => { const d = document.createElement("div"); d.innerHTML = String(h||"").replace(/<\/p>|<br\s*\/?>/gi,"\n"); return (d.textContent||"").trim(); };
const toMin = t => { const [h,m] = String(t||"0:0").split(":").map(Number); return h*60+(m||0); };
function platKeyOf(x){
  const i = x.integration || {};
  const k = platOfChannel(i.id || x.integrationId); if(k) return k;
  const ident = String(i.providerIdentifier || i.identifier || "").toLowerCase();
  return ident.startsWith("instagram") ? "ig" : ident==="facebook" ? "fb" : "";
}
const pzState = x => String(x.state || x.status || "").toUpperCase();

/* Update this app's scheduled posts from a Postiz post list. */
function pzApply(list){
  let changed = 0;
  S.posts.filter(p=>p.pz && p.pz.ids && p.pz.ids.length).forEach(p=>{
    p.pz.ids.forEach(r=>{
      const f = list.find(x=>x.id===r.id); if(!f) return;
      const st = pzState(f), k = r.plat || platKeyOf(f);
      if(!k) return;
      if(p.pz.state[k]!==st){ p.pz.state[k] = st; changed++; }
      if(st==="PUBLISHED" && !p.posted[k]){
        p.posted[k] = Date.parse(f.publishDate) || Date.now();
        if(f.releaseURL) p.links[k] = f.releaseURL;
        changed++;
      }
      if(st==="ERROR" && !p.pz.err){ p.pz.err = f.error || "Postiz couldn't publish this. Open Postiz to see why."; changed++; }
    });
  });
  return changed;
}

/* One call: fetch Postiz posts from a week ago to ~6 weeks ahead, update the
   app's own scheduled posts, link plan posts to Postiz posts in the same time
   slot, and keep the rest to show on Plan and Today. */
async function pzSync(){
  const own = S.posts.filter(p=>p.pz).map(p=>Date.parse(p.pz.date)).filter(Boolean);
  const start = Math.min(Date.now()-7*864e5, ...own.map(t=>t-864e5));
  const end   = Math.max(Date.now()+45*864e5, ...own.map(t=>t+864e5));
  const data = await pz("/public/v1/posts?startDate="+encodeURIComponent(new Date(start).toISOString())+
                        "&endDate="+encodeURIComponent(new Date(end).toISOString()));
  const list = (Array.isArray(data) ? data : (data && data.posts) || []).filter(x=>x && !x.deletedAt && !x.parentPostId);
  let changed = pzApply(list);

  const mine = new Set(S.posts.flatMap(p=>((p.pz && p.pz.ids) || []).map(r=>r.id)));
  const groups = {};
  list.forEach(x=>{ if(!mine.has(x.id)) (groups[x.group || x.id] = groups[x.group || x.id] || []).push(x); });
  let items = [], linked = 0;
  Object.values(groups).forEach(arr=>{
    const d = new Date(arr[0].publishDate); if(isNaN(d)) return;
    const ids = arr.map(x=>({id:x.id, plat:platKeyOf(x)}));
    const names = arr.map(x=>{ const k = platKeyOf(x); return k ? k.toUpperCase() : ((x.integration||{}).name || "Other"); });
    const url = (arr.find(x=>x.releaseURL)||{}).releaseURL || "";
    items.push({ ids, plats:[...new Set(ids.map(r=>r.plat).filter(Boolean))], names:[...new Set(names)],
      date:ymd(d), time:pad(d.getHours())+":"+pad(d.getMinutes()), iso:d.toISOString(),
      state:arr.map(pzState).includes("ERROR") ? "ERROR" : arr.every(x=>pzState(x)==="PUBLISHED") ? "PUBLISHED" : pzState(arr[0]),
      text:stripHtml(arr[0].content).slice(0,160), url });
  });
  /* A plan post in the same slot (same day, within 15 min) is the same post: link them. */
  items = items.filter(it=>{
    if(!it.plats.length) return true;
    const p = S.posts.find(p=>!p.pz && !isPosted(p) && p.date===it.date && p.time && Math.abs(toMin(p.time)-toMin(it.time))<=15
                         && it.plats.some(k=>p.plats[k]));
    if(!p) return true;
    p.pz = {at:Date.now(), date:it.iso, ids:it.ids.filter(r=>r.plat), state:{}, err:"", linked:true};
    p.stage = "ready"; p.updated = Date.now(); linked++; changed++;
    return false;
  });
  if(linked) pzApply(list);
  pzExt = {at:Date.now(), items};
  try{ localStorage.setItem(PZ_CACHE, JSON.stringify(pzExt)); localStorage.setItem(PZ_LAST, String(Date.now())); }catch(e){}
  if(changed) save();
  let stats = 0; try{ stats = await pzStats(); }catch(e){}
  return {changed, linked, external:items.length, stats};
}
/* ---------- stats from Postiz ----------
   Postiz returns a list like [{label:"Likes", data:[{total, date}, …]}, …] for
   a published post. Fetch it for posts Postiz published, on a slowing schedule
   (twice a day at first, then every few days, stopping after 30 days), and at
   most a few posts per check so we stay inside Postiz's hourly request limit. */
const STAT_LABELS = {
  views:["views","video views","plays","impressions","reach"],
  likes:["likes","reactions"], comments:["comments"], shares:["shares"],
  saves:["saves","saved"], follows:["follows","new followers","followers gained"]
};
function metricValue(m){
  const pts = (Array.isArray(m.data) ? m.data : []).map(d=>Number(d.total ?? d.value ?? 0)).filter(n=>!isNaN(n));
  if(!pts.length) return Number(m.total ?? m.value ?? NaN);
  const rising = pts.every((v,i)=>i===0 || v>=pts[i-1]);
  return rising ? pts[pts.length-1] : pts.reduce((a,b)=>a+b,0); // running totals vs daily counts
}
function readStats(list){
  const out = {};
  const rows = (Array.isArray(list) ? list : []).map(m=>[String(m.label||m.name||"").toLowerCase().trim(), metricValue(m)]);
  Object.entries(STAT_LABELS).forEach(([key, names])=>{
    for(const n of names){ const r = rows.find(([l])=>l===n); if(r && !isNaN(r[1])){ out[key] = Math.round(r[1]); break; } }
  });
  return out;
}
function statsDue(p, k){
  const at = num(p.posted[k]); if(!at) return false;
  const age = Date.now()-at; if(age < 60*60e3 || age > 30*864e5) return false;
  const last = num((p.statsAt||{})[k]);
  const every = age < 3*864e5 ? 12*36e5 : age < 14*864e5 ? 2*864e5 : 7*864e5;
  return Date.now()-last >= every;
}
async function pzStats(only){
  const force = !!only, jobs = [];
  (only ? [only] : S.posts).forEach(p=>{ ((p.pz && p.pz.ids) || []).forEach(r=>{
    if(r.plat && (force ? num(p.posted[r.plat]) : statsDue(p, r.plat))) jobs.push({p, r});
  }); });
  jobs.sort((a,b)=>num((a.p.statsAt||{})[a.r.plat]) - num((b.p.statsAt||{})[b.r.plat]));
  let n = 0;
  for(const {p, r} of jobs.slice(0, force ? 12 : 6)){
    const days = Math.min(90, Math.ceil((Date.now()-num(p.posted[r.plat]))/864e5)+1);
    let res;
    try{ res = await pz("/public/v1/analytics/post/"+encodeURIComponent(r.id)+"?date="+days); }
    catch(e){ if(/too many/i.test(e.message)) break; continue; }
    p.statsAt = Object.assign({}, p.statsAt, {[r.plat]:Date.now()});
    p.statsNote = Object.assign({}, p.statsNote);
    if(res && res.missing){ p.statsNote[r.plat] = "missing"; touch(p); continue; }
    const got = readStats(Array.isArray(res) ? res : (res && (res.data||res.metrics)) || []);
    if(Object.keys(got).length){ Object.assign(p.stats[r.plat], got); p.statsNote[r.plat] = "auto"; n++; }
    touch(p);
  }
  return n;
}

/* Check quietly when the app opens or comes back, at most every 10 minutes. */
async function pzAutoCheck(){
  if(!pzReady() || !pzMapped()) return;
  let last = 0; try{ last = Number(localStorage.getItem(PZ_LAST))||0; }catch(e){}
  if(Date.now()-last < 10*60e3) return;
  try{ await pzSync(); render(); if(editing) renderEditor(); }catch(e){}
}
async function pzUpload(p, files){
  const msg = el("media-msg");
  for(let i=0;i<files.length;i++){
    const f = files[i];
    if(msg) msg.textContent = "Uploading "+(i+1)+" of "+files.length+"… keep the app open";
    const fd = new FormData(); fd.append("file", f, f.name || ("upload-"+Date.now()));
    const r = await pz("/public/v1/upload", {method:"POST", body:fd});
    if(!r || !r.path) throw new Error("Postiz didn't return a file link.");
    p.media.push({id:r.id||uid(), path:r.path, name:f.name||"", type:f.type||r.type||""});
    touch(p);
  }
}

function avgBy(list, keyFn){
  const g = {};
  list.forEach(p=>{ const k = keyFn(p); if(!k) return; (g[k] = g[k]||[]).push(viewsOf(p)); });
  return Object.entries(g).map(([k,v])=>[k, Math.round(v.reduce((a,b)=>a+b,0)/v.length), v.length]).sort((a,b)=>b[1]-a[1]);
}
function bars(rows){
  const max = Math.max(1, ...rows.map(r=>r[1]));
  return rows.map(([k,v,n])=>`<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${Math.max(3,v/max*100)}%"></div></div><span class="v">${v.toLocaleString()}</span></div>`).join("");
}
function insights(){
  const L = S.posts.filter(p=>anyPosted(p) && viewsOf(p)>0);
  if(!L.length) return `<p class="small">Once you log views on posted posts (open a post → Results), this shows your best posts, and which formats and pillars get the most views.</p>`;
  const top = [...L].sort((a,b)=>viewsOf(b)-viewsOf(a)).slice(0,3);
  return `<h3>Top posts</h3><div class="list">${top.map(p=>`<button class="pc" data-fmt="${p.format}" data-a="open" data-id="${p.id}">
      <span class="ft ${p.format}">${fmtName(p.format)}</span><span class="t">${esc(titleOf(p))}</span>
      <span class="m">${viewsOf(p).toLocaleString()} views</span></button>`).join("")}</div>
    <h3 style="margin-top:16px">Average views by format</h3>${bars(avgBy(L,p=>fmtName(p.format)))}
    <h3 style="margin-top:16px">Average views by pillar</h3>${bars(avgBy(L,p=>p.pillar))}`;
}

function renderPosts(){
  const q = PF.q.toLowerCase();
  const list = S.posts.filter(p=>{
    if(PF.stage==="todo"){ if(!isTodo(p)) return false; }
    else if(PF.stage!=="all" && stageOf(p)!==PF.stage) return false;
    if(PF.format!=="all" && p.format!==PF.format) return false;
    if(q && ![p.title,p.hook,p.caption,p.pillar,p.cta].join(" ").toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>{
    const pa = isPosted(a), pb = isPosted(b);
    if(pa!==pb) return pa?1:-1;
    if(pa) return postedAt(b)-postedAt(a);
    return (a.date||"9999").localeCompare(b.date||"9999") || b.updated-a.updated;
  });
  const stages = [["all","All"],["todo","To do"],["draft","Drafts"],["ready","Ready"],["meta","In Business Suite"],["postiz","In Postiz"],["posted","Posted"]];
  el("v-posts").innerHTML = `
    <h2>Posts</h2>

}

/* ---------- PLAN ---------- */
function weekStart(off){
  const d = new Date(); d.setHours(0,0,0,0);
  const back = (d.getDay()+6)%7; // Monday start
  return addDays(d, -back + off*7);
}
function renderPlan(){
  const ws = weekStart(weekOff), goal = Math.max(1, num(S.brand.perDay)), t = today();
  const days = [...Array(7)].map((_,i)=>{
    const d = addDays(ws,i), k = ymd(d);
    const posts = S.posts.filter(p=>p.date===k).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
    const gaps = k>=t ? PLATS.filter(([pl])=>countFor(k,pl)<goal).map(([,n])=>`<span class="gap">No ${n} post</span>`).join("") : "";
    return `<div class="day ${k===t?"today":""}">
      <div class="dh"><b>${DOW[d.getDay()]} ${d.getDate()}</b><span class="small">${MON[d.getMonth()]}${k===t?" · today":""}</span>
        <button class="tiny ghost" data-a="new" data-date="${k}">+ Add</button></div>
      ${gaps?`<div style="margin-bottom:6px">${gaps}</div>`:""}
      <div class="list">${posts.map(p=>metaBtn(p) ? `<div class="rc">${postCard(p)}${metaBtn(p,"metabtn")}</div>` : postCard(p)).join("")}${extFor(k).map(extCard).join("")}</div></div>`;
  }).join("");
  const unscheduled = S.posts.filter(p=>!p.date && !isPosted(p) && p.stage==="ready");
  const end = addDays(ws,6), wsK = ymd(ws), weK = ymd(end);
  const wk = S.posts.filter(p=>p.date>=wsK && p.date<=weK);
  const reels = wk.filter(p=>p.format==="reel"), reelsLeft = reels.filter(isTodo).length, allLeft = wk.filter(isTodo).length;
  el("v-plan").innerHTML = `
    <h2>Plan</h2>
    <div class="row" style="margin:6px 0 16px">
      <button class="ghost tiny" data-a="wk" data-v="-1" aria-label="Previous week">‹</button>
      <span class="grow" style="text-align:center;font-weight:700">${ws.getDate()} ${MON[ws.getMonth()]} – ${end.getDate()} ${MON[end.getMonth()]}</span>
      <button class="ghost tiny" data-a="wk" data-v="1" aria-label="Next week">›</button>
      ${weekOff?`<button class="ghost tiny" data-a="wk" data-v="0">This week</button>`:""}
    </div>
    ${pzReady() && pzMapped() ? `<div class="row" style="margin:-6px 0 14px"><span class="small grow">${pzExt&&pzExt.at?"Postiz checked "+time12(pad(new Date(pzExt.at).getHours())+":"+pad(new Date(pzExt.at).getMinutes())):"Not checked with Postiz yet"}</span>
      <button class="ghost tiny" data-a="pz-refresh">Refresh from Postiz</button></div>` : ""}
    ${wk.length ? `<div class="panel" style="padding:10px 12px"><div class="row" style="margin:0">
      <span class="grow"><b>${reelsLeft ? reelsLeft+" of "+reels.length+" reel"+(reels.length===1?"":"s")+" still to schedule" : reels.length ? "All "+reels.length+" reels scheduled ✨" : "No reels this week"}</b><br>
      <span class="small">${allLeft} post${allLeft===1?"":"s"} still to do this week</span></span>
      ${allLeft ? `<button class="ghost tiny" data-a="pfgo" data-v="todo">See to-do</button>` : ""}</div></div>` : ""}
    ${days}
    <h2 style="margin-top:20px">Ready, not scheduled</h2>
    <p class="sub">Open one and give it a date to put it on the plan.</p>
    <div class="list">${unscheduled.length ? unscheduled.map(postCard).join("") : `<div class="empty">Nothing waiting. Posts marked Ready without a date show up here.</div>`}</div>`;
}

/* ---------- plan import ---------- */
function parseTable(text){
  text = String(text||"").replace(/^﻿/,"");
  const first = text.split(/\r?\n/,1)[0] || "";
  const delim = (first.match(/\t/g)||[]).length > (first.match(/,/g)||[]).length ? "\t" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q = false; }
      else cell += c;
      continue;
    }
    if(c==='"' && cell===""){ q = true; continue; }
    if(c===delim){ row.push(cell); cell = ""; continue; }
    if(c==="\n" || c==="\r"){ if(c==="\r" && text[i+1]==="\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; continue; }
    cell += c;
  }
  if(cell!=="" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
function parseDateCell(s){
  s = String(s||"").trim(); let m;
  if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return ymd(new Date(+m[1], m[2]-1, +m[3]));
  if((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){ let y = +m[3]; if(y<100) y += 2000; return ymd(new Date(y, m[1]-1, +m[2])); }
  if((m = s.match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/))){
    const mi = MON.findIndex(x=>x.toLowerCase()===m[1].toLowerCase());
    if(mi>=0) return ymd(new Date(+m[3], mi, +m[2]));
  }
  return "";
}
function parseTimeCell(s){
  const m = String(s||"").trim().match(/^(\d{1,2})(?::(\d{2}))?\s*([AaPp])?/); if(!m) return "";
  let h = +m[1]; const mm = +(m[2]||0);
  if(m[3]){ const pm = /p/i.test(m[3]); if(h===12) h = pm ? 12 : 0; else if(pm) h += 12; }
  return h>23 || mm>59 ? "" : pad(h)+":"+pad(mm);
}
const formatFromCell = s => /reel|video/i.test(s) ? "reel" : /carousel|slide/i.test(s) ? "carousel" : "image";
function slidesFromCell(s){
  const out = [], re = /Slide\s*\d+[^:\n]*:\s*([\s\S]*?)(?=\s*Slide\s*\d+[^:\n]*:|$)/gi; let m;
  while((m = re.exec(String(s||"")))) out.push(m[1].trim());
  return out;
}
function importPlan(text){
  const rows = parseTable(text);
  if(rows.length<2) throw new Error("No rows found. Include the header row (Date, Time, Format, …).");
  const H = rows[0].map(h=>String(h).trim().toLowerCase());
  const col = (...keys) => H.findIndex(h=>keys.some(k=>h.includes(k)));
  const C = { date:col("date"), time:col("time"), moment:col("moment"), format:col("format"), pillar:col("pillar"),
    text:col("on-image","on screen","on-screen"), visual:col("slides","visual"), caption:col("caption"),
    tags:col("hashtag"), status:col("status") };
  if(C.date<0 || C.format<0) throw new Error("Couldn't find the Date and Format columns in the header row.");
  let added = 0, updated = 0, kept = 0, bad = 0;
  rows.slice(1).forEach(r=>{
    const g = i => i>=0 ? String(r[i]||"").trim() : "";
    const date = parseDateCell(g(C.date)); if(!date){ bad++; return; }
    const time = parseTimeCell(g(C.time)), format = formatFromCell(g(C.format));
    const key = date+"|"+time+"|"+format;
    let p = S.posts.find(x=>x.importKey===key);
    if(p && (anyPosted(p) || p.pz || p.meta)){ kept++; return; }   // never overwrite something already scheduled or posted
    if(!p){ p = blankPost(format); p.importKey = key; S.posts.push(p); added++; } else updated++;
    const rawPillar = g(C.pillar);
    p.pillar = S.pillars.find(x=>x.toLowerCase()===rawPillar.toLowerCase()) || rawPillar;
    p.format = format; p.date = date; p.time = time;
    const onImage = g(C.text), vis = g(C.visual);
    if(format==="carousel"){
      const sl = slidesFromCell(vis);
      p.hook = onImage || sl[0] || "";
      const rest = sl.length ? sl.slice(1) : [];
      if(rest.length) p.slides = rest.map(t=>({id:uid(), t, d:""}));
      p.visual = sl.length ? "" : vis;
    } else {
      p.hook = onImage; p.visual = vis;
    }
    const moment = g(C.moment);
    p.title = moment ? moment+" — "+(onImage.split("\n")[0]||fmtName(format)) : "";
    p.caption = g(C.caption); p.cta = "";
    const ts = setForPillar(p.pillar); p.tagSet = ts ? ts.id : "";
    p.extraTags = g(C.tags);
    const st = g(C.status).toLowerCase();
    if(/post|publish|live/.test(st)){ PLATS.forEach(([k])=>{ if(p.plats[k] && !p.posted[k]) p.posted[k] = parseYmd(date).getTime(); }); }
    p.stage = /ready|done|made|edited|complete/.test(st) ? "ready" : "draft";
    p.updated = Date.now();
  });
  save();
  return {added, updated, kept, bad};
}
function runImport(text){
  const m = el("plan-msg");
  try{
    const r = importPlan(text);
    render();
    const parts = [];
    if(r.added) parts.push(r.added+" added");
    if(r.updated) parts.push(r.updated+" updated");
    if(r.kept) parts.push(r.kept+" left alone (already scheduled or posted)");
    if(r.bad) parts.push(r.bad+" rows skipped (no readable date)");
    const msg = parts.length ? "Imported: "+parts.join(", ")+"." : "Nothing to import.";
    const m2 = el("plan-msg"); if(m2){ m2.textContent = msg; m2.style.color = "var(--good)"; }
    toast("Plan imported");
    if(pzReady() && pzMapped()) pzSync().then(x=>{ if(x.linked){ render(); toast("Linked "+x.linked+" to posts already in Postiz"); } }).catch(()=>{});
  }catch(err){ if(m){ m.textContent = err.message; m.style.color = "var(--bad)"; } }
}

        <div class="statgrid">${METRICS.map(([m,mn])=>`<div><label class="f">${mn}</label>
          <input type="number" min="0" inputmode="numeric" data-stat="${k}.${m}" value="${esc(p.stats[k][m])}"></div>`).join("")}</div>`).join("")}
    </div>` : ""}
  </div>`;
  updateCounters();
}

function updateCounters(){
  const p = cur(); if(!p) return;
  const c = el("cap-n");
  if(c){
    const n = textFor(p,"ig").length;
    c.textContent = n.toLocaleString()+" / "+IG_CAPTION_MAX.toLocaleString()+" characters on Instagram (with call to action and tags)";
    c.classList.toggle("warn", n > IG_CAPTION_MAX);
  }
  const tp = el("tag-prev");
  if(tp){
    const tags = tagsOf(p), lim = num(S.brand.igTags);
    tp.innerHTML = tags.length ? esc(tags.join(" ")) +
      `<div class="count ${tags.length>lim?"warn":""}">${tags.length} tags${tags.length>lim?` — only the first ${lim} go on Instagram`:""}</div>` : "";
  }
  const t = el("sh-title"); if(t) t.textContent = titleOf(p);
}
function touch(p){ p.updated = Date.now(); save(); }

/* ============================================================
   EVENTS
   ============================================================ */
function newPost(opts){
  const p = blankPost(opts.format);
  if(opts.date){ p.date = opts.date; p.time = S.brand.time||""; }
  if(opts.pillar) p.pillar = opts.pillar;
  if(opts.title) p.title = opts.title;
  const ts = setForPillar(p.pillar) || S.tagSets[0];
  if(ts) p.tagSet = ts.id;
  if(p.format!=="reel") p.beats = blankPost("reel").beats;
  S.posts.push(p); save();
  return p;
}

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-a]"); if(!b) return;
  const a = b.dataset.a, id = b.dataset.id, v = b.dataset.v;
  const p = id ? getPost(id) : cur();
  let rerender = true;

  switch(a){
    case "tab": closeEditor(); view = v; window.scrollTo(0,0); if(v==="plan"||v==="today") pzAutoCheck(); break;
    case "goplan": {
      const days = Math.round((parseYmd(b.dataset.date) - weekStart(0)) / 864e5);
      weekOff = Math.floor(days / 7); view = "plan"; window.scrollTo(0,0); break;
    }
    case "pfgo": PF.stage = v; PF.format = "all"; view = "posts"; window.scrollTo(0,0); break;
    case "pf": PF[b.dataset.k] = v; break;
    case "ideapf": ideaPillar = v; break;
    case "wk": weekOff = v==="0" ? 0 : weekOff + Number(v); break;

    case "new": { const np = newPost({format:b.dataset.fmt||"reel", date:b.dataset.date}); render(); openEditor(np.id); return; }
    case "open": openEditor(id); return;
    case "close": closeEditor(); break;

    case "idea-add": {
      const t = el("idea-text").value.trim(); if(!t){ toast("Type an idea first"); return; }
      S.ideas.unshift({id:uid(), text:t, format:el("idea-fmt").value, pillar:el("idea-pillar").value, created:Date.now()});
      save(); toast("Idea saved"); break;
    }
    case "idea-del": S.ideas = S.ideas.filter(i=>i.id!==id); save(); break;
    case "idea-make": {
      const i = S.ideas.find(x=>x.id===id); if(!i) return;
      const np = newPost({format:i.format, pillar:i.pillar, title:i.text});
      S.ideas = S.ideas.filter(x=>x.id!==id); save(); render(); openEditor(np.id); return;
    }
    case "spark-next": sparkIdx = (sparkIdx + 1 + Math.floor(Math.random()*(SPARKS.length-1))) % SPARKS.length; break;
    case "spark-save":
      S.ideas.unshift({id:uid(), text:SPARKS[sparkIdx], format:"reel", pillar:"", created:Date.now()});
      sparkIdx = (sparkIdx+1) % SPARKS.length; save(); toast("Idea saved"); break;

    case "fmt": if(!p) return; p.format = v; touch(p); renderEditor(); return;
    case "stage": if(!p) return; p.stage = v; touch(p); renderEditor(); return;
    case "plat": if(!p) return;
      p.plats[v] = !p.plats[v]; touch(p); renderEditor(); return;
    case "posted": if(!p) return;
      p.posted[b.dataset.pl] = p.posted[b.dataset.pl] ? 0 : Date.now();
      if(p.posted[b.dataset.pl] && !p.date) p.date = today();
      touch(p); if(editing) renderEditor(); break;
    case "copy": if(!p) return; {
      const w = b.dataset.what;
      const txt = w==="script" ? scriptText(p) : w==="slides" ? slidesText(p) : textFor(p, w);
      copyText(txt, b.closest(".row")||b); return;
    }
    case "hook-pick": if(!p) return; p.hook = S.hooks[+b.dataset.i]||""; touch(p); renderEditor(); return;
    case "cta-pick": if(!p) return; p.cta = S.ctas[+b.dataset.i]||""; touch(p); renderEditor(); return;
    case "li-add": if(!p) return; {
      const k = b.dataset.li; p[k].push({id:uid(), g: k==="beats" ? "Beat "+(p[k].length+1) : "", t:"", d:""});
      touch(p); renderEditor(); return;
    }
    case "li-del": if(!p) return; p[b.dataset.li].splice(+b.dataset.i,1); touch(p); renderEditor(); return;
    case "li-move": if(!p) return; {
      const L = p[b.dataset.li], i = +b.dataset.i, j = i + Number(v);
      if(j<0 || j>=L.length) return; [L[i],L[j]] = [L[j],L[i]]; touch(p); renderEditor(); return;
    }
    case "dup": if(!p) return; {
      const c = JSON.parse(JSON.stringify(p));
      Object.assign(c, {id:uid(), title:(p.title||titleOf(p))+" (copy)", date:"", time:"", stage:"draft",
        posted:{ig:0,fb:0}, links:{ig:"",fb:""}, stats:{ig:{},fb:{}}, pz:null, meta:0, created:Date.now(), updated:Date.now()});
      S.posts.push(c); save(); render(); openEditor(c.id); toast("Duplicated — set a new date"); return;
    }
    case "del": if(!p) return;
      if(!confirm("Delete this post? This can't be undone.")) return;
      S.posts = S.posts.filter(x=>x.id!==p.id); save(); closeEditor(); break;

    case "ts-add": S.tagSets.push({id:uid(), name:"New set", tags:""}); save(); break;
    case "ts-del":
      if(!confirm("Delete this hashtag set?")) return;
      S.tagSets = S.tagSets.filter(t=>t.id!==id); save(); break;
    case "export": {
      const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
      const u = URL.createObjectURL(blob), l = document.createElement("a");
      l.href = u; l.download = "theme-page-studio-"+today()+".json"; document.body.appendChild(l); l.click();
      setTimeout(()=>{ URL.revokeObjectURL(u); l.remove(); }, 500); return;
    }
    case "copy-backup": copyText(JSON.stringify(S), b.closest(".row")); return;

    case "m-del": if(!p) return; p.media.splice(+b.dataset.i,1); touch(p); renderEditor(); return;
    case "m-move": if(!p) return; {
      const L = p.media, i = +b.dataset.i, j = i + Number(v);
      if(j<0 || j>=L.length) return; [L[i],L[j]] = [L[j],L[i]]; touch(p); renderEditor(); return;
    }
    case "pz-connect": {
      const m = el("pz-msg"); busy(b, true, "Connecting…");
      pzConnect().then(n=>{ renderKit(); const m2 = el("pz-msg"); if(m2) m2.textContent = "Connected. Found "+n+" account"+(n===1?"":"s")+" in Postiz."; })
        .catch(err=>{ busy(b, false, "Connect"); if(m){ m.textContent = err.message; m.style.color = "var(--bad)"; } });
      return;
    }
    case "plan-import": {
      const t = el("plan-paste").value; if(!t.trim()){ toast("Paste the rows first"); return; }
      runImport(t); return;
    }
    case "meta": if(!p) return;
      p.meta = p.meta ? 0 : Date.now();
      if(p.meta) p.stage = "ready";
      touch(p); if(editing) renderEditor();
      toast(p.meta ? "Marked scheduled in Business Suite" : "Unmarked");
      break;
    case "pz-stats": if(!p) return; {
      busy(b, true, "Updating…");
      pzStats(p).then(n=>{ renderEditor(); render(); toast(n ? "Stats updated" : "No new numbers from Postiz yet"); })
        .catch(err=>{ busy(b, false, "Update stats now"); toast(err.message); });
      return;
    }
    case "pz-forget": setRelayCfg({}); renderKit(); toast("Removed from this device"); return;
    case "pz-schedule": if(!p) return; {
      busy(b, true, "Scheduling…");
      pzSchedule(p).then(()=>{ renderEditor(); render(); toast("Scheduled in Postiz ✨"); })
        .catch(err=>{ busy(b, false, "Schedule with Postiz"); const m = el("pz-post-msg"); if(m){ m.textContent = err.message; m.style.color = "var(--bad)"; } });
      return;
    }
    case "pz-cancel": if(!p) return; {
      if(!confirm("Cancel this post in Postiz? It won't be published.")) return;
      busy(b, true, "Cancelling…");
      pzCancel(p).then(()=>{ renderEditor(); render(); toast("Cancelled in Postiz"); })
        .catch(err=>{ busy(b, false, "Cancel in Postiz"); const m = el("pz-post-msg"); if(m) m.textContent = err.message; });
      return;
    }
    case "pz-refresh": {
      const label = b.textContent; busy(b, true, "Checking…");
      pzSync().then(r=>{ render(); if(editing) renderEditor();
          toast(r.linked ? "Linked "+r.linked+" plan post"+(r.linked===1?"":"s")+" to Postiz" : r.changed ? "Updated from Postiz" : "Up to date with Postiz"); })
        .catch(err=>{ busy(b, false, label); toast(err.message); });
      return;
    }
    default: rerender = false;
  }
  if(rerender) render();
});

document.addEventListener("input", e=>{
  const t = e.target;
  if(t.type==="checkbox" || t.type==="file") return;
  const p = cur();
  if(t.id==="post-q"){
    PF.q = t.value; const pos = t.selectionStart; renderPosts();
    const n = el("post-q"); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){}
    return;
  }
  if(p && t.dataset.f){
    p[t.dataset.f] = t.value;
    if(t.dataset.f==="pillar"){
      const ts = setForPillar(t.value);
      if(ts && p.tagSet!==ts.id){
        p.tagSet = ts.id;
        const sel = document.querySelector('#sheet select[data-f="tagSet"]'); if(sel) sel.value = ts.id;
      }
    }
    touch(p); updateCounters(); return;
  }
  if(p && t.dataset.li){ const it = p[t.dataset.li][+t.dataset.i]; if(it){ it[t.dataset.k] = t.value; touch(p); } return; }
  if(p && t.dataset.stat){ const [pl,m] = t.dataset.stat.split("."); p.stats[pl][m] = t.value==="" ? "" : Number(t.value); touch(p); return; }
  if(p && t.dataset.link){ p.links[t.dataset.link] = t.value; touch(p); return; }
  if(t.dataset.kit){ S.brand[t.dataset.kit] = t.value; save(); if(t.dataset.kit==="name") el("hdr-name").textContent = t.value.trim()||"Theme Page Studio"; return; }
  if(t.dataset.pzmap){
    const ch = S.postiz.channels.find(c=>c.id===t.value);
    S.postiz[t.dataset.pzmap] = ch || null; save(); return;
  }
  if(t.dataset.kitn){ S.brand[t.dataset.kitn] = t.value==="" ? "" : Number(t.value); save(); return; }
  if(t.dataset.lines){ S[t.dataset.lines] = t.value.split("\n").map(s=>s.trim()).filter(Boolean); save(); return; }
  if(t.dataset.ts){
    const set = S.tagSets.find(x=>x.id===t.dataset.ts); if(!set) return;
    set[t.dataset.k] = t.value; save();
    if(t.dataset.k==="tags"){ const c = el("tsn-"+set.id); if(c) c.textContent = tagCount(t.value)+" tags"; }
  }
});

document.addEventListener("change", e=>{
  if(e.target.id==="media-file"){
    const p = cur(), files = [...e.target.files]; if(!p || !files.length) return;
    const lbl = e.target.closest("label"); if(lbl) lbl.style.opacity = ".5";
    pzUpload(p, files).then(()=>{ if(editing===p.id) renderEditor(); toast("Uploaded"); })
      .catch(err=>{ if(editing===p.id){ renderEditor(); const m = el("media-msg"); if(m){ m.textContent = err.message; m.style.color = "var(--bad)"; } } });
    return;
  }
  if(e.target.id==="plan-file"){
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader(); r.onload = () => runImport(r.result); r.readAsText(f); e.target.value = "";
    return;
  }
  if(e.target.id!=="import-file") return;
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!confirm("Replace everything in the app with this backup?")) return;
      const rev = S.rev||0; S = normalize(d); S.rev = rev; save(); render(); toast("Backup restored");
    }catch(err){ toast("That file isn't a valid backup"); }
  };
  r.readAsText(f);
});

document.addEventListener("keydown", e=>{ if(e.key==="Escape" && editing){ closeEditor(); render(); } });

load();
if(metaAutoPost()) render();
pzAutoCheck();
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ if(metaAutoPost()) render(); pzAutoCheck(); } });

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

<!-- ============================================================
     SYNC — settings live in firebase-config.js, NOT in this file.
     Data is stored in the same Firestore document as the old app
     (pipelines/{uid}) but under its own "studio" field, written with
     merge so the old app's "data" field is left untouched.
     ============================================================ -->
<script type="module">
const CFG = window.FIREBASE_CONFIG || {};
const B = window.BRIDGE;
const el = id => document.getElementById(id);
const show = (id,on) => { const e = el(id); if(e) e.style.display = on ? "block" : "none"; };

let why = "";
if(!window.FIREBASE_CONFIG){
  why = "firebase-config.js didn't load. It must sit next to index.html and start with  window.FIREBASE_CONFIG = {...}";
}else{
  const missing = ["apiKey","authDomain","projectId","appId"].filter(k=>!CFG[k]);
  if(missing.length) why = "firebase-config.js is missing: " + missing.join(", ");
}

if(why){
  B.setStatus("Sync is off. This device only.", "bad");
  show("sync-setup", true); el("sync-why").textContent = why;
}else{
  let mods;
  try{
    mods = await Promise.all([
      import("https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js")
    ]);
  }catch(e){
    B.setStatus("Offline. Saved on this device, will sync when you're back online.", "bad");
    throw e;
  }
  const [{initializeApp}, A, F] = mods;
  const app = initializeApp(CFG), auth = A.getAuth(app), db = F.getFirestore(app);
  await A.setPersistence(auth, A.browserLocalPersistence).catch(()=>{});

  let ref = null, stop = null, first = true, pending = null, timer = null;
  const stamp = () => { const d = new Date(); return (d.getHours()%12||12)+":"+String(d.getMinutes()).padStart(2,"0")+(d.getHours()<12?"am":"pm"); };
  const msg = (t,ms=3000) => { const e = el("sync-msg"); e.textContent = t; if(ms) setTimeout(()=>{ if(e.textContent===t) e.textContent=""; }, ms); };

  async function push(){
    if(!ref) return;
    const st = B.getState();
    try{
      await F.setDoc(ref, {studio:JSON.stringify(st), studioRev:st.rev||0, studioAt:Date.now()}, {merge:true});
      B.setStatus("Synced "+stamp(), "good");
    }catch(e){ B.setStatus("Sync failed. Still saved on this device.", "bad"); }
  }
  B.onLocalChange = () => { if(!ref) return; B.setStatus("Syncing…"); clearTimeout(timer); timer = setTimeout(push, 1200); };

  function attach(u){
    ref = F.doc(db, "pipelines", u); first = true;
    stop = F.onSnapshot(ref, snap => {
      const d = snap.exists() ? snap.data() : {};
      if(!d.studio){ push(); first = false; return; }
      let remote; try{ remote = JSON.parse(d.studio); }catch(e){ return; }
      const rrev = d.studioRev||0, local = B.getState(), lrev = B.getRev();
      if(first){
        first = false;
        const differs = JSON.stringify([local.posts,local.ideas]) !== JSON.stringify([remote.posts,remote.ideas]);
        if(B.hasContent(local) && B.hasContent(remote) && differs){
          pending = remote; pending.rev = rrev;
          const n = s => (s.posts||[]).length+" posts, "+(s.ideas||[]).length+" ideas";
          el("sync-clash-txt").textContent = "This device has "+n(local)+". The synced copy has "+n(remote)+". Pick one to keep. The other is replaced.";
          show("sync-clash", true); B.setStatus("Two different copies. Pick one below.", "bad");
          return;
        }
        if(!B.hasContent(local) && B.hasContent(remote)){ remote.rev = rrev; B.applyRemote(remote); B.setStatus("Synced "+stamp(), "good"); return; }
      }
      if(pending) return;
      if(rrev > lrev){ remote.rev = rrev; B.applyRemote(remote); B.setStatus("Updated from another device "+stamp(), "good"); }
      else if(lrev > rrev) push();
      else B.setStatus("Synced "+stamp(), "good");
    }, () => B.setStatus("Sync offline. Still saved on this device.", "bad"));
  }

  el("clash-local").onclick = () => { pending = null; show("sync-clash", false); push(); };
  el("clash-remote").onclick = () => { if(pending){ B.applyRemote(pending); pending = null; } show("sync-clash", false); B.setStatus("Synced "+stamp(), "good"); };
  el("sync-push").onclick = () => push();

  A.onAuthStateChanged(auth, user => {
    if(stop){ stop(); stop = null; }
    show("sync-signin", !user); show("sync-on", !!user); show("sync-clash", false);
    if(user){ B.setStatus("Connecting as "+(user.email||"you")+"…"); attach(user.uid); }
    else { ref = null; B.setStatus("Signed out. Saving on this device only."); }
  });

  const creds = () => [el("sync-email").value.trim(), el("sync-pass").value];
  const fail = e => msg((e.code||"").replace("auth/","").replace(/-/g," ") || "Sign-in failed", 5000);
  el("sync-in").onclick = async () => {
    const [e,pw] = creds(); if(!e||!pw) return msg("Email and password needed");
    msg("Signing in…", 0);
    try{ await A.signInWithEmailAndPassword(auth,e,pw); msg("Signed in"); el("sync-pass").value = ""; }catch(err){ fail(err); }
  };
  el("sync-new").onclick = async () => {
    const [e,pw] = creds(); if(!e||pw.length<6) return msg("Password needs 6+ characters");
    msg("Creating…", 0);
    try{ await A.createUserWithEmailAndPassword(auth,e,pw); msg("Account created"); el("sync-pass").value = ""; }catch(err){ fail(err); }
  };
  el("sync-out").onclick = () => A.signOut(auth);
}
</script>
